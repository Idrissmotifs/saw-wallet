<style>
:root{--bg:#f4f7f5;--surf:#fff;--ink:#172522;--muted:#6c7a75;--line:#e0e9e4;--soft:#eaf3ef;--pri:#0d6b50;--pri2:#0a5a43;--onpri:#fff;--err:#b52b2b;--good:#0d7651;--gold:#f3c969;--hdr:#073d31;--hdr2:#0d6b50;--glow:rgba(13,107,80,.45)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:linear-gradient(140deg,#062d25,#0d6b50);color:#fff;padding:22px 20px 22px;border-radius:0 0 26px 26px}
.wrap{max-width:520px;margin:auto;padding:0 16px 40px}
.brand{display:flex;align-items:center;gap:11px;justify-content:space-between}
.brand .l{display:flex;align-items:center;gap:11px}
.mark{width:42px;height:42px;border:2px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-size:22px;font-weight:900}
.brand h1{font-size:23px;letter-spacing:2px;margin:0}
.brand small{display:block;color:#d5e7df;font-size:11px;letter-spacing:.6px}
.tag{margin:16px 0 4px;color:#d5e7df;font-size:13px}
.demo{display:inline-block;margin-top:10px;border:1px solid #b4d9c9;border-radius:999px;padding:5px 10px;color:#e4fff1;font-size:11px;letter-spacing:.5px}
button,input,textarea,select{font-family:inherit}
button{border:0;cursor:pointer}button:disabled{opacity:.55;cursor:default}
.ghost{background:rgba(255,255,255,.14);color:#fff;padding:8px 12px;font-size:12px;border-radius:12px;font-weight:700}
.tabs{display:flex;gap:8px;margin:16px 0 0}
.tabs button{flex:1;background:#e7efeb;color:#496058;padding:11px 6px;font-size:13px;border-radius:12px;font-weight:700}
.tabs button.on{background:var(--hdr);color:#fff}
.f{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 5px 18px #173c2d08}
.f h2{font-size:18px;margin:0 0 10px}
.f label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.f input,.f textarea,.f select{width:100%;border:1px solid #d7e1dc;border-radius:11px;padding:13px;font-size:15px;background:#fbfdfc;outline-color:var(--pri);font-family:inherit}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;width:100%;box-shadow:0 6px 14px -8px var(--glow);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--soft);color:var(--hdr);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:9px 12px;font-size:12px;width:auto}
.btn.bad{background:#fbeaea;color:var(--err);box-shadow:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{color:var(--muted);font-size:12.5px;line-height:1.5}
.sub{color:var(--muted);font-size:12.5px}
.msg{font-size:13px;margin-top:12px;line-height:1.45;overflow-wrap:anywhere;color:var(--good)}.msg.err{color:var(--err)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:7px 0}
.box{background:#fbfdfc;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.foot{text-align:center;font-size:11px;color:#74817c;padding:18px 10px 5px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#173c2d;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:20;max-width:90%;display:none}
a{color:var(--pri)}
.wl h2{margin-top:0}.wbal{background:linear-gradient(135deg,var(--hdr,#123C94),var(--hdr2,#2F7BFF));color:#fff;border-radius:22px;padding:18px;margin:6px 0 12px;display:grid;gap:4px;box-shadow:0 12px 26px -14px var(--glow)}
.wbal span{font-size:13px;opacity:.85}.wbal b{font-size:32px;letter-spacing:.3px;font-variant-numeric:tabular-nums}.wbal small{opacity:.85}.wbal i{font-style:normal;font-size:11px;letter-spacing:.8px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:2px 10px;justify-self:start;margin-top:6px}
.wtabs{margin:12px 0}.wl .acts .btn{flex:1;min-width:130px}.wl .btn.sm{width:auto;flex:1}
.wpin,.wcode{text-align:center;letter-spacing:10px;font-size:24px;font-weight:700}.wcodebox{font-size:38px;letter-spacing:12px;text-align:center;font-weight:800;background:var(--soft);border-radius:18px;padding:16px;margin:12px 0;color:var(--pri);font-variant-numeric:tabular-nums}
.wbig{font-size:20px}.wh b.wpos{color:#0E8A5F}.wh b.wneg{color:var(--err,#B3261E)}.wh small{display:block}
.wmoy{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wrad{margin:0!important;font-weight:600}.wrad input{position:absolute;opacity:0;pointer-events:none}.wrad span{display:block;text-align:center;padding:11px 8px;border-radius:14px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}.wrad input:checked+span{box-shadow:inset 0 0 0 2px var(--pri);background:var(--surf);color:var(--pri)}
.wo .acts{margin-top:8px}

.wbal{box-shadow:0 12px 26px -14px var(--glow)}
.wtabs button{font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#spl{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#062d25,#0d6b50);display:grid;place-content:center;justify-items:center;gap:22px;transition:opacity .45s ease,visibility .45s}
#spl.off{opacity:0;visibility:hidden;pointer-events:none}
#spl .spw{font:900 58px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:6px;color:#f3c969}
#spl .spb{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
#spl .spb i{display:block;height:100%;width:40%;border-radius:2px;background:#f3c969;animation:spl 1.1s ease-in-out infinite}
@keyframes spl{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){#spl .spb i{animation:none!important}}
</style>
</head>

<script>
'use strict';
/* SAW utilise le MÊME compte que ZooDo (même projet Supabase) : pas de second compte à créer. */
const SUPABASE_URL='https://kocfhlzubxemotwiaopb.supabase.co';
const SUPABASE_KEY='sb_publishable_eZvBp3224ZEsWQqdA-xujg_36DVDH6Z';
const ZOODO_URL='https://idrissmotifs.github.io/emarket/';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={user:null,name:'',isAdmin:false,view:'orders',mode:'in'};
let OT=null,tt;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
const rpc=async(f,a)=>{const {data,error}=await sb.rpc(f,a||{});if(error)throw new Error(error.message);return data};
function nice(e){const m=(e&&e.message)||String(e||'');
 if(/invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
 if(/rate|too many|second/i.test(m))return 'Trop de demandes. Réessayez dans quelques minutes.';
 if(/expired|invalid/i.test(m))return 'Code incorrect ou expiré.';
 if(/same|different/i.test(m)&&/password/i.test(m))return 'Choisissez un mot de passe différent de l\'ancien.';
 if(/Failed to fetch|network/i.test(m))return 'Connexion impossible. Vérifiez votre réseau.';
 return m||'Une erreur est survenue.'}
const say=(sel,t,ok)=>{const e=$(sel);if(e)e.innerHTML='<div class="msg '+(ok?'':'err')+'">'+esc(t)+'</div>'};

/* ---------- blocage après 5 essais (10 minutes) ---------- */
const lockKey='saw_lock';
function lockLeft(){try{const o=JSON.parse(localStorage.getItem(lockKey)||'null');if(!o)return 0;const left=o.t+600000-Date.now();if(left<=0||o.n<5)return 0;return Math.ceil(left/60000)}catch(e){return 0}}
function lockFail(){try{const o=JSON.parse(localStorage.getItem(lockKey)||'null')||{n:0,t:0},fresh=Date.now()>o.t+600000;const n=(fresh?0:o.n)+1;localStorage.setItem(lockKey,JSON.stringify({n,t:Date.now()}))}catch(e){}}
function lockReset(){try{localStorage.removeItem(lockKey)}catch(e){}}
const lockMsg=()=>{const l=lockLeft();return l?'Trop de tentatives. Réessayez dans '+l+' minute(s).':''};

/* ---------- gabarit ---------- */
function head(extra){return '<div class="top"><div class="wrap" style="padding:0"><div class="brand"><div class="l"><div class="mark">S</div><div><h1>SAW</h1><small>PORTEFEUILLE</small></div></div>'+(extra||'')+'</div>'}
function shell(inner,logged){
 const tabs=[['orders','📦 Commandes'],['wallet','👛 Portefeuille']];if(S.isAdmin)tabs.push(['admin','🛡️ Admin']);
 $('#app').innerHTML=(logged?head('<button class="ghost" data-a="out">Quitter</button>')+'<p class="tag">Le portefeuille de ZooDo</p><span class="demo">ARGENT FICTIF · DÉMO</span></div></div>':head()+'<p class="tag">Le portefeuille de ZooDo</p><p class="tag" style="margin-top:0">Même compte que ZooDo, code reçu par e-mail.</p><span class="demo">VERSION DÉMO · ARGENT FICTIF</span></div></div>')+
  '<div class="wrap">'+(logged?'<div class="tabs">'+tabs.map(t=>'<button data-a="view" data-v="'+t[0]+'" class="'+(S.view===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>':'')+'<div id="main">'+inner+'</div><div class="foot">SAW · démonstration · aucun vrai argent'+(logged?'<br>'+esc(S.user.email||''):'')+'</div></div>';
}
function main(h){const m=$('#main');if(m)m.innerHTML=h}

/* ---------- connexion (même compte que ZooDo) ---------- */
function authScreen(){
 S.user=null;shell('<div class="f"><h2>Se connecter</h2><label>Adresse e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><div id="amsg"></div><br><button class="btn" data-a="auth">Continuer</button>'+
  '<div class="acts"><button class="btn alt sm" data-a="forgot">Mot de passe oublié ?</button></div>'+
  '<p class="note">Chaque connexion demande un code reçu par e-mail.<br><b>Pas encore de compte ?</b> Créez-le sur ZooDo : le même compte sert ici, et votre portefeuille s\'ouvre au premier paiement.</p>'+
  '<div class="acts"><button class="btn alt" data-a="zoodo">Ouvrir ZooDo</button></div></div>',false);
}
function codeScreen(){
 shell('<div class="f"><h2>Code reçu par e-mail</h2><p class="note">Un code à usage unique a été envoyé à <b>'+esc(OT.em)+'</b>. Vérifiez aussi les courriers indésirables (spam).</p><label>Code</label><input id="otc" inputmode="numeric" maxlength="10" autocomplete="one-time-code" style="text-align:center;letter-spacing:6px;font-size:20px"><div id="amsg"></div><br>'+
  '<button class="btn" data-a="verify">Valider le code</button><div class="acts"><button class="btn alt sm" data-a="resend">Renvoyer le code</button><button class="btn alt sm" data-a="cancel">Annuler</button></div></div>',false);
}
async function sendCode(em){
 const lk=lockMsg();if(lk)return lk;
 if(OT&&OT.em===em&&Date.now()-OT.t<60000)return 'Attendez '+Math.ceil((60000-(Date.now()-OT.t))/1000)+' secondes avant de renvoyer le code.';
 const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false}});
 if(error){const x=error.message||'';return /signups? not allowed|not found|user.*not/i.test(x)?'Aucun compte avec cet e-mail. Créez votre compte sur ZooDo.':nice(error)}
 return '';
}
async function doAuth(){
 const lk=lockMsg();if(lk)return say('#amsg',lk);
 const em=($('#em').value||'').trim().toLowerCase(),pw=$('#pw').value||'';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return say('#amsg','Adresse e-mail invalide.');
 if(!pw)return say('#amsg','Saisissez votre mot de passe.');
 try{
  const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){lockFail();return say('#amsg',nice(error))}
  await sb.auth.signOut({scope:'local'});          /* la session ne s'ouvre qu'après le code */
  OT=null;const e2=await sendCode(em);if(e2)return say('#amsg',e2);
  OT={em,m:'in',t:Date.now()};codeScreen();
 }catch(e){say('#amsg',nice(e))}
}
async function doVerify(){
 const lk=lockMsg();if(lk)return say('#amsg',lk);
 const tok=(($('#otc')||{}).value||'').replace(/\s/g,'');
 if(!OT||tok.length<4)return say('#amsg','Saisissez le code reçu.');
 const {error}=await sb.auth.verifyOtp({email:OT.em,token:tok,type:'email'});
 if(error){lockFail();return say('#amsg',nice(error))}
 lockReset();const fp=OT.m==='fp';OT=null;
 if(fp)return newPwScreen();
 await start();
}
function forgotScreen(){
 const e0=(($('#em')||{}).value||'').trim();
 shell('<div class="f"><h2>Mot de passe oublié</h2><p class="note">Entrez votre e-mail. Nous vous envoyons un code à usage unique ; après l\'avoir saisi, vous choisissez un nouveau mot de passe et vous êtes connecté.</p><label>E-mail</label><input id="fpe" type="email" autocomplete="email" value="'+esc(e0)+'"><div id="amsg"></div><br><button class="btn" data-a="fpsend">Envoyer le code</button><div class="acts"><button class="btn alt" data-a="cancel">Retour</button></div></div>',false);
}
async function fpSend(){
 const em=(($('#fpe')||{}).value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return say('#amsg','Entrez une adresse e-mail valide.');
 const e2=await sendCode(em);
 if(e2&&!/^Aucun compte/.test(e2))return say('#amsg',e2);
 OT={em,m:'fp',t:Date.now()};   /* même réponse que l'e-mail existe ou non */
 codeScreen();toast('Si un compte existe avec cet e-mail, un code vient d\'être envoyé.');
}
function newPwScreen(){
 shell('<div class="f"><h2>Nouveau mot de passe</h2><p class="note">E-mail confirmé. Choisissez un nouveau mot de passe (10 caractères minimum, avec lettres et chiffres).</p><label>Nouveau mot de passe</label><input id="np1" type="password" autocomplete="new-password"><label>Confirmez</label><input id="np2" type="password" autocomplete="new-password"><div id="amsg"></div><br><button class="btn" data-a="fpset">Enregistrer et me connecter</button></div>',false);
}
async function fpSet(){
 const a1=($('#np1')||{}).value||'',a2=($('#np2')||{}).value||'';
 if(a1.length<10)return say('#amsg','Mot de passe : 10 caractères minimum.');
 if(!/[A-Za-z]/.test(a1)||!/\d/.test(a1))return say('#amsg','Le mot de passe doit contenir des lettres et des chiffres.');
 if(a1!==a2)return say('#amsg','Les deux mots de passe ne sont pas identiques.');
 const {error}=await sb.auth.updateUser({password:a1});if(error)return say('#amsg',nice(error));
 toast('Mot de passe changé. Vous êtes connecté.');await start();
}

/* ---------- application ---------- */
async function start(){
 const {data}=await sb.auth.getSession();
 S.user=data&&data.session?data.session.user:null;
 if(!S.user)return authScreen();
 S.isAdmin=false;S.name='';
 try{S.isAdmin=!!(await rpc('saw_est_admin'))}catch(e){}
 try{const p=await sb.from('profiles').select('nom,boutique').eq('id',S.user.id).maybeSingle();if(p&&p.data)S.name=p.data.nom||p.data.boutique||''}catch(e){}
 S.view='orders';shell('',true);W.orders();
}
function view(v){
 S.view=v;document.querySelectorAll('.tabs [data-a=view]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='orders')W.orders();else if(v==='wallet')W.open();else adminScreen();
}

/* ---------- administrateur : litiges et contrôle ---------- */
async function adminScreen(){
 main('<div class="f"><h2>Administration</h2><p class="note">Chargement…</p></div>');
 try{
  const l=await sb.from('saw_litiges').select('id,ordre_id,motif,statut,created_at').eq('statut','Ouvert').order('created_at');
  const L=(l&&l.data)||[];
  main('<div class="f"><h2>Litiges à trancher ('+L.length+')</h2>'+(L.length?L.map(x=>'<div class="box"><b>Commande #'+x.ordre_id+'</b><p class="note" style="margin:4px 0">'+esc(x.motif)+'</p><div class="acts"><button class="btn alt sm" data-a="trancher" data-id="'+x.ordre_id+'" data-d="rembourser">↩ Rembourser l\'acheteur</button><button class="btn sm" data-a="trancher" data-id="'+x.ordre_id+'" data-d="liberer">💚 Payer le vendeur</button></div></div>').join(''):'<div class="empty">Aucun litige ouvert.</div>')+'</div>'+
   '<div class="f"><h2>Contrôle des comptes</h2><div class="acts"><button class="btn alt" data-a="equilibre">Lancer le contrôle d\'équilibre</button></div><div id="eqmsg"></div></div>');
 }catch(e){main('<div class="f"><div class="msg err">'+esc(nice(e))+'</div></div>')}
}
function trancherForm(id,d){
 main('<div class="f"><h2>'+(d==='liberer'?'Payer le vendeur':'Rembourser l\'acheteur')+'</h2><p class="note">Commande #'+Number(id)+'. Indiquez le motif de la décision (visible dans le journal).</p><label>Motif</label><textarea id="tm" maxlength="300" rows="3"></textarea><div id="amsg"></div><br><button class="btn" data-a="tgo" data-id="'+Number(id)+'" data-d="'+esc(d)+'">Confirmer la décision</button><div class="acts"><button class="btn alt" data-a="view" data-v="admin">Annuler</button></div></div>');
}
async function trancher(id,d){
 const m=(($('#tm')||{}).value||'').trim();if(m.length<3)return say('#amsg','Indiquez le motif de la décision.');
 try{await rpc('saw_trancher_litige',{p_ordre:Number(id),p_decision:d,p_motif:m});toast('Décision enregistrée.');adminScreen()}catch(e){say('#amsg',nice(e))}
}
async function equilibre(){
 try{const r=await rpc('saw_controle_equilibre'),ok=r.operations_desequilibrees===0&&r.soldes_negatifs===0&&Number(r.total_journal)===0;
  $('#eqmsg').innerHTML='<div class="msg '+(ok?'':'err')+'">'+(ok?'✔ Tout est équilibré.':'⚠ Écart détecté !')+'<br>Total du journal : '+esc(r.total_journal)+' · opérations déséquilibrées : '+esc(r.operations_desequilibrees)+' · soldes négatifs : '+esc(r.soldes_negatifs)+' · argent bloqué : '+esc(r.bloque_total)+'</div>'}
 catch(e){say('#eqmsg',nice(e))}
}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest&&e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 try{
  if(a==='auth')await doAuth();
  else if(a==='verify')await doVerify();
  else if(a==='resend'){if(!OT)return;const e2=await sendCode(OT.em);if(e2)return say('#amsg',e2);OT.t=Date.now();lockFail();say('#amsg','Code renvoyé.',1)}
  else if(a==='cancel'){OT=null;authScreen()}
  else if(a==='forgot')forgotScreen();
  else if(a==='fpsend')await fpSend();
  else if(a==='fpset')await fpSet();
  else if(a==='zoodo')window.open(ZOODO_URL,'_blank','noopener,noreferrer');
  else if(a==='out'){try{await rpc('saw_verrouiller')}catch(x){}await sb.auth.signOut({scope:'local'});S.user=null;S.isAdmin=false;authScreen()}
  else if(a==='view')view(t.dataset.v);
  else if(a==='trancher')trancherForm(t.dataset.id,t.dataset.d);
  else if(a==='tgo')await trancher(t.dataset.id,t.dataset.d);
  else if(a==='equilibre')await equilibre();
 }catch(x){toast(nice(x))}
});

/* ===== module portefeuille (identique à celui de ZooDo) ===== */
const WHOST={sb,esc,sheet:h=>{if(h)main(h);else W.orders()},close:()=>{view('orders')},toast,user:()=>S.user,login:()=>authScreen(),after:()=>{},name:()=>S.name||''};
/* ===== PORTEFEUILLE SAW (module fermé : n'appelle que les fonctions saw_*) ===== */
const W=(H=>{
 const esc=H.esc,rpc=async(f,a)=>{const {data,error}=await H.sb.rpc(f,a||{});if(error)throw new Error(error.message);return data};
 const fmt=n=>(Number(n)||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' F';
 const dt=t=>{try{return new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
 const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2)+'-ref-0000');
 const err=e=>{const m=(e&&e.message)||'';return /Failed to fetch|network/i.test(m)?'Connexion impossible. Vérifiez votre réseau.':(m||'Une erreur est survenue.')};
 const pinMsg=r=>{const [k,v]=String(r||'').split(':');if(k==='incorrect')return 'PIN incorrect. Il vous reste '+v+' essai'+(v>1?'s':'')+'.';if(k==='bloque')return 'Trop d\'erreurs. Réessayez dans '+v+' minute'+(v>1?'s':'')+'.';return 'Ouvrez d\'abord votre portefeuille.'};
 const say=(m,ok)=>{const e=document.getElementById('wmsg');if(e)e.innerHTML=m?'<div class="msg '+(ok?'':'err')+'">'+esc(m)+'</div>':''};
 const val=id=>{const e=document.getElementById(id);return e?String(e.value||'').trim():''};
 const pinF=(id,label)=>'<label>'+label+'</label><input id="'+id+'" class="wpin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••">';
 const wrap=(h,back)=>H.sheet('<div class="f wl">'+h+'</div>');
 const loading=t=>wrap('<h2>👛 '+(t||'Portefeuille')+'</h2><p class="note">Chargement…</p>');
 const fail=(e,back)=>wrap('<h2>👛 Portefeuille</h2><div class="msg err">'+esc(err(e))+'</div><div class="acts"><button class="btn alt" data-w="close">Fermer</button></div>');
 let S={from:'home'};
 const locked=e=>/verrouill/i.test((e&&e.message)||'');
 const STAT={'En attente':['⏳','En attente d\'acceptation'],'Bloqué':['✅','Acceptée · livraison en cours'],'Libéré':['💚','Livrée · payée'],'Refusé':['✖','Refusée par le vendeur · remboursée'],'Annulé':['✖','Annulée · remboursée'],'Non accepté':['⌛','Non acceptée à temps · remboursée'],'Expiré':['⌛','Non livrée à temps · remboursée'],'En litige':['⚖️','Litige en cours'],'Remboursé':['↩️','Remboursée après litige'],'Libéré après litige':['💚','Payée après litige']};

 /* ---- ouverture / déverrouillage ---- */
 async function open(tab){
  if(!H.user())return H.login();
  S.tab=tab||S.tab||'cmd';loading();
  try{const e=await rpc('saw_etat');S.et=e;if(!e.ouvert)return openForm();if(!e.deverrouille)return pinScreen();return home()}catch(x){fail(x)}
 }
 function openForm(next){
  S.next=next||null;
  wrap('<h2>👛 Ouvrir mon portefeuille</h2><p class="note">Un portefeuille sécurisé pour payer sur ZooDo. <b>Argent fictif (démonstration)</b> : aucun vrai argent pour le moment.</p>'
   +'<label>Nom complet</label><input id="wn" maxlength="60" autocomplete="name" value="'+esc(H.name()||'')+'"><label>Numéro de téléphone</label><input id="wt" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="+226 00 00 00 00">'
   +pinF('wp1','Choisissez un code PIN (4 chiffres)')+pinF('wp2','Confirmez le PIN')
   +'<p class="note">🔐 Ce PIN protège vos paiements et votre portefeuille. Ne le donnez à personne, même à ZooDo.</p><div id="wmsg"></div><br>'
   +'<button class="btn" data-w="doopen">Ouvrir mon portefeuille</button><div class="acts"><button class="btn alt" data-w="close">Fermer</button></div>');
 }
 async function doOpen(){
  const p1=val('wp1'),p2=val('wp2');
  if(!/^\d{4}$/.test(p1))return say('Le PIN doit avoir exactement 4 chiffres.');
  if(p1!==p2)return say('Les deux PIN ne sont pas identiques.');
  const b=document.querySelector('[data-w=doopen]');if(b)b.disabled=true;
  try{await rpc('saw_ouvrir_portefeuille',{p_nom:val('wn'),p_tel:val('wt'),p_pin:p1});H.toast('Portefeuille ouvert. Bienvenue !');const n=S.next;S.next=null;if(n)return n();return home()}
  catch(e){say(err(e));if(b)b.disabled=false}
 }
 function pinScreen(next,title){
  S.next=next||null;
  wrap('<h2>🔒 '+(title||'Portefeuille verrouillé')+'</h2><p class="note">Entrez votre code PIN à 4 chiffres.</p>'+pinF('wp','Code PIN')+'<div id="wmsg"></div><br><button class="btn" data-w="unlock">Déverrouiller</button><div class="acts"><button class="btn alt sm" data-w="forgot">PIN oublié ?</button><button class="btn alt" data-w="close">Fermer</button></div>');
  setTimeout(()=>{const e=document.getElementById('wp');if(e)e.focus()},50);
 }
 async function unlock(){
  const p=val('wp');if(!/^\d{4}$/.test(p))return say('Entrez les 4 chiffres de votre PIN.');
  const b=document.querySelector('[data-w=unlock]');if(b)b.disabled=true;
  try{const r=await rpc('saw_deverrouiller',{p_pin:p});if(!r.ok){say(pinMsg(r.pin));if(b)b.disabled=false;return}const n=S.next;S.next=null;if(n)return n();return home()}
  catch(e){say(err(e));if(b)b.disabled=false}
 }

 /* ---- accueil du portefeuille ---- */
 async function home(tab){
  S.from='home';if(tab)S.tab=tab;S.tab=S.tab||'cmd';
  try{
   const [sol,ords]=await Promise.all([rpc('saw_mon_solde'),rpc('saw_mes_ordres')]);S.sol=sol;S.ords=ords||[];
   let hist=[];if(S.tab==='hist')hist=await rpc('saw_historique')||[];
   const t=S.tab,tabs=[['cmd','📦 Commandes'],['hist','🧾 Historique'],['sec','🔐 PIN']];
   wrap('<h2>👛 Mon portefeuille</h2><div class="wbal"><span>Solde disponible</span><b>'+fmt(sol.disponible)+'</b><small>Bloqué en attente de livraison : '+fmt(sol.bloque)+'</small><i>ARGENT FICTIF · DÉMO</i></div>'
    +'<div class="acts"><button class="btn" data-w="rech">＋ Recharger</button><button class="btn alt" data-w="ret">↗ Retirer</button></div>'
    +'<div class="tabs wtabs">'+tabs.map(x=>'<button data-w="tab" data-t="'+x[0]+'" class="'+(t===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'
    +(t==='cmd'?ordersHtml(S.ords):t==='hist'?histHtml(hist):secHtml())
    +'<div class="acts"><button class="btn alt" data-w="close">Fermer</button></div>');
  }catch(e){if(locked(e))return pinScreen();fail(e)}
 }
 const typeTxt={depart_demo:'Bienvenue',recharge_demo:'Recharge',retrait_demo:'Retrait',blocage:'Paiement',liberation:'Vente',commission:'Commission',remboursement:'Remboursement',sponsorisation:'Sponsorisation',retrait_admin:'Retrait ZooDo'};
 function histHtml(h){
  if(!h.length)return '<div class="empty">Aucune opération.</div>';
  return h.map(x=>{const m=Number(x.montant_xof),pos=m>0;return '<div class="row wh"><span>'+esc(x.libelle||typeTxt[x.type]||x.type)+'<small class="sub"> · '+esc(dt(x.created_at))+(x.poche==='bloque'?' · bloqué':'')+'</small></span><b class="'+(pos?'wpos':'wneg')+'">'+(pos?'+':'−')+fmt(Math.abs(m))+'</b></div>'}).join('');
 }
 function secHtml(){
  return '<div class="box"><b>Code PIN</b><p class="note">Vous pouvez changer votre PIN à tout moment.</p><div class="acts"><button class="btn alt sm" data-w="chpin">Changer mon PIN</button><button class="btn alt sm" data-w="forgot">PIN oublié</button><button class="btn alt sm" data-w="lock">🔒 Verrouiller maintenant</button></div></div>'
   +'<p class="note">Le portefeuille se verrouille tout seul après quelques minutes. Chaque paiement, chaque annulation et chaque retrait demandent votre PIN.</p>';
 }

 /* ---- commandes ---- */
 function ordersHtml(list){
  if(!list.length)return '<div class="empty">Aucune commande pour le moment.<br><small>Pour acheter, ouvrez une annonce et touchez « Payer avec SAW ».</small></div>';
  return list.map(o=>{
   const s=STAT[o.statut]||['',o.statut],ach=o.role==='acheteur',pend=o.statut==='En attente',blk=o.statut==='Bloqué';
   let info='';

 async function act(a,t){
  const id=t&&t.dataset?t.dataset.id:null;
  switch(a){
   case 'close':H.close();try{if(H.user())rpc('saw_verrouiller').catch(()=>{})}catch(e){}break;
   case 'open':open();break;case 'home':home();break;case 'orders':orders();break;
   case 'back':back();break;
   case 'doopen':doOpen();break;case 'unlock':unlock();break;
   case 'tab':home(t.dataset.t);break;
   case 'acc':acc(id);break;
   case 'ref':motifForm('dref',id,'✖ Refuser la commande','Motif (facultatif)');break;case 'dref':doRef(id);break;
   case 'can':motifForm('dcan',id,'Annuler la commande','Raison pour le vendeur (obligatoire)');break;case 'dcan':doCan(id);break;
   case 'vcan':doVcan(id);break;
   case 'liv':livForm(id);break;case 'dliv':doLiv(id);break;
   case 'lit':litForm(id);break;case 'dlit':doLit(id);break;
   case 'code':showCode(id);break;
   case 'dopay':doPay();break;case 'dospons':doSpons();break;
   case 'rech':rechForm();break;case 'dorech':doRech();break;
   case 'ret':retForm();break;case 'doret':doRet();break;
   case 'chpin':chPinForm();break;case 'dochpin':doChPin();break;
   case 'forgot':forgot();break;case 'doreinit':doReinit();break;case 'mailok':mailOk();break;
   case 'lock':try{await rpc('saw_verrouiller')}catch(e){}pinScreen();break;
  }
 }
