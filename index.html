/* ---------- blocage après 5 échecs : 10 minutes ---------- */
function lockLeft(){try{const o=JSON.parse(localStorage.getItem(lockKey)||'null');if(o&&o.n>=5&&Date.now()<o.t+600000)return Math.max(1,Math.ceil((o.t+600000-Date.now())/60000))}catch(e){}return 0}
function lockFail(){try{const o=JSON.parse(localStorage.getItem(lockKey)||'null')||{n:0,t:0},fresh=Date.now()>o.t+600000;localStorage.setItem(lockKey,JSON.stringify({n:(fresh?0:o.n)+1,t:Date.now()}))}catch(e){}}
function lockReset(){try{localStorage.removeItem(lockKey)}catch(e){}}
const lockMsg=()=>{const l=lockLeft();return l?'Trop de tentatives. Réessayez dans '+l+' minute(s).':''};

/* ---------- messages ---------- */
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function say(sel,t,ok){const e=$(sel);if(e)e.innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+esc(t)+'</div>'}
function nice(e){
  const m=(e&&e.message)||String(e||'');
  if(/invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
  if(/rate|too many|second/i.test(m))return 'Trop de demandes. Réessayez dans quelques minutes.';
  if(/expired|invalid/i.test(m))return 'Code incorrect ou expiré.';
  if(/password/i.test(m)&&/6|short|weak/i.test(m))return 'Mot de passe trop court (8 caractères minimum).';
  if(/Failed to fetch|network/i.test(m))return 'Connexion impossible. Vérifiez votre réseau.';
  return m||'Une erreur est survenue.';
}
const rpc=async(f,a)=>{const {data,error}=await sb.rpc(f,a||{});if(error)throw new Error(error.message);return data};

/* ---------- feuille (fenêtre) ---------- */

/* ---------- données ---------- */
const STAT={'Bloqué':['En attente de livraison','w'],'Libéré':['Terminé','' ],'Annulé':['Annulé','r'],'Expiré':['Expiré – remboursé','r'],'En litige':['En litige','w'],'Remboursé':['Remboursé','r'],'Libéré après litige':['Terminé (après litige)','']};
const TYPES={depart_demo:'Solde de départ (démo)',recharge_demo:'Recharge fictive',blocage:'Paiement bloqué',liberation:'Paiement libéré',commission:'Commission SAW',remboursement:'Remboursement'};
async function load(){
  try{
    const [bal,ord,hist]=await Promise.all([
      rpc('saw_mon_solde'),
      sb.from('saw_ordres').select('id,acheteur_id,vendeur_id,montant_xof,commission_xof,statut,ref_externe,tentatives,delai_fin,created_at').order('created_at',{ascending:false}).limit(50),
      sb.from('saw_journal').select('id,poche,montant_xof,type,ordre_id,created_at').order('id',{ascending:false}).limit(60)]);
    S.bal=bal||{disponible:0,bloque:0};
    S.orders=(ord&&ord.data)||[];
    S.hist=(hist&&hist.data)||[];
    try{S.isAdmin=!!(await rpc('saw_est_admin'))}catch(e){S.isAdmin=false}
    if(S.isAdmin){const l=await sb.from('saw_litiges').select('id,ordre_id,motif,statut,created_at').eq('statut','Ouvert').order('created_at');S.lit=(l&&l.data)||[]}
  }catch(e){toast(nice(e))}
}

}
function head(extra){return '<div class="top"><div class="wrap" style="padding:0"><div class="brand"><div class="l"><div class="mark">S</div><div><h1>SAW</h1><small>PORTEFEUILLE</small></div></div>'+(extra||'')+'</div>'}

  '<div class="wrap">'+(LINK?'<div class="panel"><p class="muted" style="margin:0">Connectez-vous (ou créez un compte) pour payer cette annonce ZooDo.</p></div>':'')+'<div class="tabs"><button data-a="mode" data-m="in" class="'+(S.mode==='in'?'on':'')+'">Connexion</button><button data-a="mode" data-m="up" class="'+(S.mode==='up'?'on':'')+'">Inscription</button></div>'+
  '<div class="panel"><h2>'+(S.mode==='in'?'Se connecter':'Créer un compte')+'</h2>'+
  '<div class="field"><label>Adresse e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email"></div>'+
  '<div class="field"><label>Mot de passe'+(S.mode==='up'?' (8 caractères minimum)':'')+'</label><input id="pw" type="password" autocomplete="'+(S.mode==='in'?'current-password':'new-password')+'"></div>'+
  '<button class="primary" data-a="auth">'+(S.mode==='in'?'Continuer':'Créer mon compte')+'</button><div id="amsg"></div>'+
  '<p class="muted" style="margin-top:14px">Chaque connexion et chaque inscription demande un code reçu par e-mail. Les montants affichés ici sont fictifs.</p></div>'+
  '<div class="foot">SAW · démonstration · aucun vrai argent</div></div>';
}

  const b=S.bal;
  const tabs=[['home','Accueil'],['orders','Paiements'],['hist','Historique']];
  if(S.isAdmin)tabs.push(['admin','Admin']);
  let body='';
  if(S.view==='home')body=homeBody();
  else if(S.view==='orders')body=ordersBody();
  else if(S.view==='hist')body=histBody();
  else if(S.view==='admin'&&S.isAdmin)body=adminBody();
  return head('<button class="ghost" data-a="out">Quitter</button>')+
   '<p class="tag">Solde disponible</p><p class="balance">'+F(b.disponible)+'</p><div class="sub">Bloqué en attente de livraison : <b>'+F(b.bloque)+'</b></div><span class="demo">ARGENT FICTIF · DÉMO</span></div></div>'+
   '<div class="wrap"><div class="tabs">'+tabs.map(t=>'<button data-a="view" data-v="'+t[0]+'" class="'+(S.view===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+body+
   '<div class="foot">SAW · démonstration · aucun vrai argent<br>'+esc(S.user.email||'')+'</div></div>';
}
function homeBody(){
  return '<div class="panel"><h2>Actions</h2><div class="acts"><button class="secondary" data-a="recharge">＋ Recharge fictive</button><button class="primary" data-a="zoodo">Acheter sur ZooDo</button></div>'+
   '<button class="secondary" style="margin-top:10px" data-a="refresh">Actualiser</button><p class="muted" style="margin-top:12px">Pour payer, ouvrez une annonce sur ZooDo et touchez « Payer avec SAW ». Le prix est fixé par l\'annonce et ne peut pas être modifié.</p></div>'+
   '<div class="panel"><h2>Mon identifiant SAW</h2><p class="muted">Donnez cet identifiant à un acheteur pour qu\'il puisse vous payer.</p><div class="idbox">'+esc(S.user.id)+'</div><button class="secondary sm" data-a="copyid" style="width:auto">Copier mon identifiant</button></div>'+
   '<div class="panel"><h2>Comment ça marche</h2><p class="muted">1. L\'acheteur paie : l\'argent est <b>bloqué</b> (pas encore chez le vendeur).<br>2. L\'acheteur reçoit un <b>code à 5 chiffres</b> et le donne au vendeur à la livraison.<br>3. Le vendeur saisit le code : l\'argent lui est versé (commission SAW de 1 %).<br>4. Sans livraison au bout de 7 jours, l\'acheteur est remboursé.<br>5. En cas de problème, un litige peut être ouvert.</p></div>';
}

   '<div class="panel"><h2>Contrôle des comptes</h2><button class="secondary" data-a="equilibre">Lancer le contrôle d\'équilibre</button><div id="eqmsg"></div><button class="secondary" style="margin-top:10px" data-a="expire">Rembourser les ordres dépassés</button></div>';

/* ---------- code e-mail ---------- */
function codeForm(){
  sheet('<h2>Code reçu par e-mail</h2><p class="muted">Un code à usage unique a été envoyé à <b>'+esc(OT.em)+'</b>. Vérifiez aussi vos courriers indésirables (spam).</p>'+
   '<div class="field"><label>Code</label><input id="otc" inputmode="numeric" maxlength="10" autocomplete="one-time-code" style="text-align:center;letter-spacing:6px;font-size:20px"></div><div id="cmsg"></div><br>'+
   '<button class="primary" data-a="verify">Valider le code</button><div class="btns"><button class="secondary sm" data-a="resend">Renvoyer le code</button><button class="secondary sm" data-a="close">Annuler</button></div>');
}
async function sendCode(em,ty){
  const lk=lockMsg();if(lk)return lk;
  if(OT&&OT.em===em&&Date.now()-OT.t<60000)return 'Attendez '+Math.ceil((60000-(Date.now()-OT.t))/1000)+' secondes avant de renvoyer le code.';
  const {error}=ty==='signup'?await sb.auth.resend({type:'signup',email:em}):await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false}});
  if(error){const x=error.message||'';return /signups? not allowed|not found|user.*not/i.test(x)?'Aucun compte avec cet e-mail. Créez un compte.':nice(error)}
  OT={em,ty,t:Date.now()};return '';
}
async function doAuth(){
  const lk=lockMsg();if(lk)return say('#amsg',lk);
  const em=($('#em').value||'').trim().toLowerCase(),pw=$('#pw').value||'';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return say('#amsg','Adresse e-mail invalide.');
  if(S.mode==='up'&&pw.length<8)return say('#amsg','Mot de passe trop court (8 caractères minimum).');
  if(!pw)return say('#amsg','Saisissez votre mot de passe.');
  S.busy=true;
  try{
    if(S.mode==='in'){
      const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error){lockFail();return say('#amsg',nice(error))}
      await sb.auth.signOut({scope:'local'});          // la session n'est ouverte qu'après le code
      const e2=await sendCode(em,'email');if(e2)return say('#amsg',e2);
      codeForm();
    }else{
      lockFail();
      const {data,error}=await sb.auth.signUp({email:em,password:pw});
      if(error)return say('#amsg',nice(error));
      if(data&&data.session){await sb.auth.signOut({scope:'local'});return say('#amsg','Inscription momentanément indisponible.')}
      if(data&&data.user&&data.user.identities&&data.user.identities.length===0)return say('#amsg','Cette adresse e-mail est déjà utilisée. Connectez-vous.');
      OT={em,ty:'signup',t:Date.now()};codeForm();
    }
  }catch(e){say('#amsg',nice(e))}finally{S.busy=false}
}
async function doVerify(){
  const lk=lockMsg();if(lk)return say('#cmsg',lk);
  const tok=($('#otc').value||'').replace(/\s/g,'');
  if(!OT||tok.length<4)return say('#cmsg','Saisissez le code reçu.');
  const {error}=await sb.auth.verifyOtp({email:OT.em,token:tok,type:OT.ty==='signup'?'signup':'email'});
  if(error){lockFail();return say('#cmsg',nice(error))}
  lockReset();OT=null;closeSheet();
  await start();
}
async function start(){
  const {data}=await sb.auth.getSession();
  S.user=data&&data.session?data.session.user:null;
  if(S.user){try{await rpc('saw_creer_compte')}catch(e){toast(nice(e))}await load()}
  S.view='home';render();
  if(S.user&&LINK){const L=LINK;LINK=null;payForm(L.a)}
}

}

  const m=parseInt(($('#rm').value||'').replace(/\D/g,''),10),btn=$('#rgo');
  if(!m||m<100)return say('#rmsg','Montant minimum : 100 F.');
  btn.disabled=true;
  try{await rpc('saw_recharge_demo',{p_ref:REC_REF,p_montant:m});REC_REF=null;closeSheet();await load();render();toast('Compte rechargé.')}
  catch(e){say('#rmsg',nice(e));btn.disabled=false}
}
let PAY=null;
const pm=e=>{const m=(e&&e.message)||'';return /Failed to fetch|network/i.test(m)?'Connexion impossible. Vérifiez votre réseau.':(m||'Une erreur est survenue.')};
async function payForm(ann){
  ORD_REF=newRef();PAY=null;
  sheet('<h2>Payer avec SAW</h2><p class="muted">Chargement de l\'annonce…</p><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
  try{
    const r=await rpc('saw_voir_annonce',{p_annonce:Number(ann)});
    PAY={a:r.annonce,prix:r.prix};
    sheet('<h2>Payer avec SAW</h2><p class="muted">L\'argent sera bloqué jusqu\'à la livraison. Vous recevrez un code à donner au vendeur.</p>'+
     '<div class="field"><label>Annonce ZooDo #'+Number(r.annonce)+'</label><div class="idbox">'+esc(r.nom)+'</div></div>'+
     '<div class="field"><label>Montant à payer</label><div class="idbox" style="font-size:22px;font-weight:700">'+F(r.prix)+'</div></div>'+
     '<p class="muted">Ce montant est fixé par l\'annonce : il ne peut pas être modifié.</p><div id="pmsg"></div><br>'+
     '<button class="primary" id="pgo" data-a="pgo">Payer et bloquer l\'argent</button><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
  }catch(e){
    sheet('<h2>Payer avec SAW</h2><div class="msg bad">'+esc(pm(e))+'</div><br><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
  }
}
async function doPay(){
  const btn=$('#pgo');if(!PAY)return;
  btn.disabled=true;
  try{
    const r=await rpc('saw_payer_annonce',{p_ref:ORD_REF,p_annonce:PAY.a,p_prix_vu:PAY.prix});
    ORD_REF=null;PAY=null;await load();render();
    sheet('<h2>Paiement bloqué ✔</h2><p class="muted">'+F(r.montant)+' sont bloqués. Donnez ce code <b>au vendeur seulement à la livraison</b> :</p><div class="code">'+esc(r.code)+'</div><p class="muted">Vous pouvez le revoir dans « Paiements ». Sans livraison avant le '+D(r.delai_fin)+', vous serez remboursé.</p><button class="primary" data-a="close">J\'ai compris</button>');
  }catch(e){say('#pmsg',pm(e));btn.disabled=false}
}
async function showCode(id){
  try{const c=await rpc('saw_mon_code',{p_ordre:Number(id)});
    sheet('<h2>Code de livraison</h2><p class="muted">À donner au vendeur uniquement quand vous avez bien reçu votre commande.</p><div class="code">'+esc(c||'—')+'</div><button class="primary" data-a="close">Fermer</button>')}
  catch(e){toast(nice(e))}
}
function deliverForm(id){
  sheet('<h2>Confirmer la livraison</h2><p class="muted">Saisissez le code à 5 chiffres donné par l\'acheteur. Après 5 erreurs, l\'ordre est bloqué.</p><div class="field"><input id="dc" inputmode="numeric" maxlength="5" style="text-align:center;letter-spacing:8px;font-size:22px" autocomplete="off"></div><div id="dmsg"></div><br><button class="primary" id="dgo" data-a="dgo" data-id="'+Number(id)+'">Valider</button><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
}
async function doDeliver(id){
  const c=($('#dc').value||'').trim(),btn=$('#dgo');
  if(!/^\d{5}$/.test(c))return say('#dmsg','Le code contient 5 chiffres.');
  btn.disabled=true;
  try{
    const r=await rpc('saw_confirmer_livraison',{p_ordre:Number(id),p_code:c});
    if(r==='ok'){closeSheet();await load();render();toast('Livraison confirmée. Argent reçu.')}
    else if(r==='bloque'){say('#dmsg','Trop d\'erreurs : cet ordre est bloqué. Contactez l\'acheteur ou ouvrez un litige.');btn.disabled=false;await load()}
    else{await load();say('#dmsg','Code incorrect.');btn.disabled=false}
  }catch(e){say('#dmsg',nice(e));btn.disabled=false}
}
async function doCancel(id){
  if(!confirm('Annuler ce paiement ? L\'acheteur sera remboursé.'))return;
  try{await rpc('saw_annuler_ordre',{p_ordre:Number(id)});await load();render();toast('Paiement annulé, acheteur remboursé.')}catch(e){toast(nice(e))}
}
function disputeForm(id){
  sheet('<h2>Signaler un problème</h2><p class="muted">L\'argent reste bloqué jusqu\'à la décision de SAW. Expliquez le problème.</p><div class="field"><textarea id="lm" rows="4" maxlength="300"></textarea></div><div id="lmsg"></div><br><button class="primary" id="lgo" data-a="lgo" data-id="'+Number(id)+'">Ouvrir le litige</button><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
}
async function doDispute(id){
  const m=($('#lm').value||'').trim(),btn=$('#lgo');
  if(m.length<3)return say('#lmsg','Expliquez le problème en quelques mots.');
  btn.disabled=true;
  try{await rpc('saw_ouvrir_litige',{p_ordre:Number(id),p_motif:m});closeSheet();await load();render();toast('Litige ouvert.')}
  catch(e){say('#lmsg',nice(e));btn.disabled=false}
}
function trancherForm(id,d){
  sheet('<h2>'+(d==='liberer'?'Payer le vendeur':'Rembourser l\'acheteur')+'</h2><p class="muted">Ordre #'+Number(id)+'. Le motif est obligatoire et conservé.</p><div class="field"><textarea id="tm" rows="3" maxlength="300"></textarea></div><div id="tmsg"></div><br><button class="primary" id="tgo" data-a="tgo" data-id="'+Number(id)+'" data-d="'+esc(d)+'">Confirmer la décision</button><div class="btns"><button class="secondary sm" data-a="close">Fermer</button></div>');
}
async function doTrancher(id,d){
  const m=($('#tm').value||'').trim(),btn=$('#tgo');
  if(m.length<3)return say('#tmsg','Indiquez le motif de la décision.');
  btn.disabled=true;
  try{await rpc('saw_trancher_litige',{p_ordre:Number(id),p_decision:d,p_motif:m});closeSheet();await load();render();toast('Décision enregistrée.')}
  catch(e){say('#tmsg',nice(e));btn.disabled=false}
}

/* ---------- clics ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-a]');
  if(!t){if(ev.target.id==='ovl')closeSheet();return}
  const a=t.dataset.a,id=t.dataset.id;
  try{
    if(a==='mode'){S.mode=t.dataset.m;render()}
    else if(a==='auth')await doAuth();
    else if(a==='verify')await doVerify();
    else if(a==='resend'){const e=await sendCode(OT.em,OT.ty);if(e)say('#cmsg',e);else{lockFail();say('#cmsg','Code renvoyé.',1)}}
    else if(a==='close')closeSheet();
    else if(a==='view'){S.view=t.dataset.v;render()}
    else if(a==='out'){await sb.auth.signOut({scope:'local'});S.user=null;S.isAdmin=false;S.orders=[];S.hist=[];S.bal={disponible:0,bloque:0};render()}
    else if(a==='refresh'){await load();render();toast('Actualisé.')}
    else if(a==='copyid'){try{await navigator.clipboard.writeText(S.user.id);toast('Identifiant copié.')}catch(e){toast('Copie impossible : sélectionnez-le à la main.')}}
    else if(a==='recharge')rechargeForm();
    else if(a==='rgo')await doRecharge();
    else if(a==='zoodo')window.open('https://idrissmotifs.github.io/emarket/','_blank','noopener,noreferrer');
    else if(a==='pgo')await doPay();
    else if(a==='code')await showCode(id);
    else if(a==='deliver')deliverForm(id);
    else if(a==='dgo')await doDeliver(id);
    else if(a==='cancel')await doCancel(id);
    else if(a==='dispute')disputeForm(id);
    else if(a==='lgo')await doDispute(id);
    else if(a==='trancher')trancherForm(id,t.dataset.d);
    else if(a==='tgo')await doTrancher(id,t.dataset.d);
    else if(a==='equilibre'){const r=await rpc('saw_controle_equilibre');const ok=r.total_journal===0&&r.operations_desequilibrees===0&&r.soldes_negatifs===0&&r.bloque_total===r.ordres_en_cours_total;
      $('#eqmsg').innerHTML='<div class="msg '+(ok?'good':'bad')+'">'+(ok?'✔ Tout est équilibré.':'⚠ Écart détecté !')+'<br>Total du journal : '+esc(r.total_journal)+' · opérations déséquilibrées : '+esc(r.operations_desequilibrees)+' · soldes négatifs : '+esc(r.soldes_negatifs)+'<br>Bloqué : '+F(r.bloque_total)+' / ordres en cours : '+F(r.ordres_en_cours_total)+'</div>'}
    else if(a==='expire'){const n=await rpc('saw_expirer_ordres');await load();render();toast(n+' ordre(s) remboursé(s).')}
  }catch(e){toast(nice(e))}
});

/* ---------- démarrage ---------- */
start();
</script>
</body>
</html>
